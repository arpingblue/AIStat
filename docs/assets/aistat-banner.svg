    <circle cx="122" cy="154" r="9"/><circle cx="196" cy="40" r="9"/><circle cx="196" cy="154" r="11"/>
    <circle cx="238" cy="96" r="9"/><circle cx="306" cy="96" r="12" stroke="#65a9ff"/>
